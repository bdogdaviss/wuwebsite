<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Wakeup — stay connected with your community" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wakeup" />
    <title>Wakeup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@3.5/dist/add-to-homescreen.min.css" />
    <script src="https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@3.5/dist/add-to-homescreen.min.js"></script>
    <style>
      :root {
        --app-vh: 100dvh;
      }
      @supports not (height: 100dvh) {
        :root {
          --app-vh: 100vh;
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: var(--app-vh);
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        touch-action: pan-y;
        position: fixed;
        inset: 0;
      }
      #root {
        width: 100%;
        height: var(--app-vh);
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Prevent iOS zoom on input focus — inputs must be >= 16px */
      input, textarea, select {
        font-size: 16px !important;
      }

      /* Mobile scaling for all UI elements */
      @media (max-width: 768px) {
        html {
          font-size: 14px;
        }

        /* Improve scrolling */
        * {
          -webkit-overflow-scrolling: touch;
        }

        /* Touch feedback for interactive elements */
        button:active,
        [role="button"]:active {
          opacity: 0.7;
          transition: opacity 0.05s;
        }
      }

      /* Safe area padding utilities */
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (window.AddToHomeScreen) {
          window.AddToHomeScreenInstance = window.AddToHomeScreen({
            appName: 'Wakeup',
            appNameDisplay: 'standalone',
            appIconUrl: 'apple-touch-icon.png',
            assetUrl: 'https://cdn.jsdelivr.net/gh/philfung/add-to-homescreen@3.5/dist/assets/img/',
            maxModalDisplayCount: -1,
            displayOptions: { showMobile: true, showDesktop: true },
            allowClose: true,
            showArrow: true,
          });
          window.AddToHomeScreenInstance.show('en');
        }
      });
    </script>
  </body>
</html>
